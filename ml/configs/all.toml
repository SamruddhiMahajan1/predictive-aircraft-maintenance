# Full pooled training — FD001-FD004, the shipped artifact's breadth.
name = "all"
datasets = ["FD001", "FD002", "FD003", "FD004"]
rul_cap = 125
seed = 42

[split]
strategy = "group_shuffle"
test_size = 0.20
groups = "unit"

[features]
rolling_window = 5
rolling_ddof = 0
zscore_by = "regime"
excluded = ["unit", "cycle", "RUL"]

[model]
n_estimators = 1000
learning_rate = 0.05
max_depth = 6
min_child_weight = 3
subsample = 0.8
colsample_bytree = 0.8
reg_lambda = 1.0
early_stopping_rounds = 50

[gates]
max_cv_rmse = 21.0
max_test_rmse = 25.0
max_mae = 20.0
min_r2 = 0.80
