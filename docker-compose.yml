# Fleet Digital Twin — development stack.
#
#   docker compose up --build       →  http://localhost:8080
#
# Three containers, one origin:
#   web    nginx, serves the built SPA and proxies /api + /ws to the monolith
#   api    FastAPI monolith (REST + WebSocket + ML inference + replay engine)
#   db     PostgreSQL 16
#
# Production differences live in docker-compose.prod.yml. Do not edit that file to tune
# a development annoyance; override with a `docker-compose.override.yml` instead.

name: fdt

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fdt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fdt}
      POSTGRES_DB: ${POSTGRES_DB:-fdt}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Bound to loopback only: handy for psql and for the throwaway test database,
      # never reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fdt} -d ${POSTGRES_DB:-fdt}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    depends_on:
      db: { condition: service_healthy }
    environment:
      FDT_ENVIRONMENT: ${FDT_ENVIRONMENT:-development}
      FDT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-fdt}:${POSTGRES_PASSWORD:-fdt}@db:5432/${POSTGRES_DB:-fdt}
      FDT_JWT_SECRET: ${FDT_JWT_SECRET:?set FDT_JWT_SECRET in .env — see .env.example}
      FDT_LOG_LEVEL: ${FDT_LOG_LEVEL:-INFO}
      # Same-origin in Docker, so no cross-origin allowlist is needed for the browser.
      # This entry exists only for `npm run dev` against the containerised API.
      FDT_CORS_ORIGINS: ${FDT_CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      FDT_DEMO_MODE: ${FDT_DEMO_MODE:-true}
      FDT_DEMO_TICK_SECONDS: ${FDT_DEMO_TICK_SECONDS:-1.2}
      FDT_RUL_CAP: ${FDT_RUL_CAP:-125}
      # Variant-driven artifact resolution. Do NOT pin FDT_ML_MODEL_PATH here: it
      # overrides only the model, leaving the contract to resolve from the variant, and
      # the two then disagree about which directory the artifact set lives in. A
      # container started that way degraded to the deterministic fallback with a fully
      # valid model on disk.
      FDT_ML_VARIANT: ${FDT_ML_VARIANT:-all}
      FDT_ML_DATASET: ${FDT_ML_DATASET:-FD001}
      FDT_ML_FALLBACK: ${FDT_ML_FALLBACK:-true}
      FDT_DATA_DIR: /app/data
    volumes:
      # 43 MB of NASA C-MAPSS telemetry: fetched by scripts/fetch-cmapss.sh, not committed.
      - ./backend/data/cmapss:/app/data/cmapss:ro
      # Trained boosters: staged by scripts/stage_ml_artifacts.py, not committed.
      - ./backend/data/ml:/app/data/ml:ro
    ports:
      # Exposed so /docs and /redoc are reachable without going through nginx. Loopback
      # only; docker-compose.prod.yml removes this port entirely.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

# Throwaway database for the pytest suite, which drops and recreates the public
  # schema on every session. Behind the `test` profile so `docker compose up` never
  # starts it; `make test` brings it up and tears it down around the run.
  db-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fdt
      POSTGRES_PASSWORD: fdt
      POSTGRES_DB: fdt_test
    tmpfs:
      # An in-memory database: nothing to persist, and nothing survives a crash.
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fdt -d fdt_test"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

volumes:
  db-data: