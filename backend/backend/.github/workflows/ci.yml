name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fdt
          POSTGRES_PASSWORD: fdt
          POSTGRES_DB: fdt
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fdt" --health-interval 5s
          --health-timeout 3s --health-retries 10

    env:
      FDT_DATABASE_URL: postgresql+psycopg://fdt:fdt@localhost:5432/fdt
      FDT_JWT_SECRET: ci-secret-0123456789abcdefghijklmnop
      FDT_DEMO_MODE: "false"
      FDT_ML_FALLBACK: "true"
      FDT_DATA_DIR: data

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check app tests scripts
      - name: mypy (core, domain, ml must be strictly typed)
        run: mypy app/core app/domain app/ml
      - name: tests
        run: pytest -q --junitxml=report.xml
      - name: migrations round-trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: report.xml
