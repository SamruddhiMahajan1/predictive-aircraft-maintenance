name: sync-fork

# Syncs this fork with the upstream repo daily at midnight IST (18:30 UTC).
# Also runnable manually from Actions → sync-fork → Run workflow.
on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync with upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # Use a PAT so the push back to your fork triggers downstream
          # workflows (like `deploy`). The default GITHUB_TOKEN push is
          # silently ignored by Actions to prevent infinite loops.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/ORIGINAL_OWNER/predictive-aircraft-maintenance.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Merge upstream into fork
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git merge upstream/main --ff-only

      - name: Push to fork
        run: git push origin main
