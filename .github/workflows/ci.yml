name: ci

on:
  push:
    branches: [main, dev, develop, shubham]
  pull_request:
  workflow_dispatch:

# A new push supersedes the in-flight run on the same ref — but never on main:
# cancelling a main run mid-pytest is exactly how a green suite ends with the
# confusing "The operation was canceled" instead of a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  api:
    name: API · lint, types, tests
    runs-on: ubuntu-latest
    # A genuine hang (DB lock, replay thread keeping the loop alive) must fail
    # loudly instead of burning the whole runner budget and getting cancelled.
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fdt
          POSTGRES_PASSWORD: fdt
          POSTGRES_DB: fdt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fdt -d fdt_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # The suite drops and recreates the public schema, so this must stay a throwaway
      # database. The workflow provisions one; never point it at anything shared.
      FDT_TEST_DATABASE_URL: postgresql+psycopg://fdt:fdt@localhost:5432/fdt_test
      # env.py reads FDT_DATABASE_URL, not the test-only alias, so the `alembic`
      # steps below need it as well. Without it they silently fall back to the
      # config default `.../fdt`, a database this service never creates.
      FDT_DATABASE_URL: postgresql+psycopg://fdt:fdt@localhost:5432/fdt_test
      FDT_ENVIRONMENT: development
      FDT_DEMO_MODE: "false"
      FDT_ML_FALLBACK: "true"
      FDT_DATA_DIR: ${{ github.workspace }}/backend/data

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            ml/pyproject.toml
            ml/requirements.lock

      - name: Install ml package
        run: pip install -e ../ml

      - name: Install
        run: pip install -e ".[dev]"

      - name: ruff
        run: ruff check app tests scripts

      - name: ruff format (enforced)
        run: ruff format --check app tests scripts

      - name: mypy --strict (core, domain, ml + API layers)
        run: mypy app/core app/domain app/ml app/api app/services app/realtime ml/src/rul/contract

      - name: pytest
        run: pytest -q --junitxml=report.xml

      - name: migrations round-trip
        # The downgrade has to tear down what the upgrade built — enums included,
        # since Alembic never autogenerates their teardown — or the second upgrade
        # dies on DuplicateObject. `alembic check` then asserts the rebuilt schema
        # still matches app.models, so a migration can never drift from the ORM.
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report
          path: backend/report.xml
          retention-days: 7

  web:
    name: Web · test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint + React Hooks
        run: npx eslint src --ext .js,.jsx

      - name: Test (node:test)
        run: npm test

      - name: npm audit (fail on high/critical)
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Bundle budget (dist < 3.5 MB gzipped)
        run: |
          MAX_BYTES=3670016  # 3.5 MB
          for f in dist/**/*.js dist/**/*.css; do
            if [ -f "$f" ]; then
              size=$(gzip -c "$f" | wc -c)
              if [ "$size" -gt "$MAX_BYTES" ]; then
                echo "::error::$f gzipped size ${size}B > ${MAX_BYTES}B"
                exit 1
              fi
            fi
          done

      - name: Assert the 3D assets were copied into the bundle
        # A missing .glb is invisible to `vite build` — it only fails at runtime, in the
        # browser, as an empty scene. Check the output here instead.
        run: |
          for asset in rafale.glb landing-gear.glb radar.glb engine.bin.gz engine.meta.json; do
            test -f "dist/models/$asset" || { echo "::error::dist/models/$asset is missing"; exit 1; }
          done
          du -sh dist
          # Phase 4.7 gate: 3D payload must stay under 3.5 MB compressed equivalent.
          # Raw 9.2 MB fails; Draco + gzip_static brings it to ~1.6 MB.
          models_bytes=$(du -sb dist/models | cut -f1)
          echo "dist/models: ${models_bytes}B"
          if [ "$models_bytes" -gt 3670016 ]; then
            echo "::warning::dist/models ${models_bytes}B > 3.5MB — Draco compression pending (docs/16 Phase 4.7)"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
          retention-days: 7

  ml:
    name: ML · contract, pipeline, gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ml/pyproject.toml
            ml/requirements.lock
      - name: Install
        run: pip install -e . && pip install -r requirements.lock
      - name: Validate fixture (fast, no data)
        run: python -m rul validate --fixture
      - name: Pipeline dry-run (2 engines, writes nothing)
        run: python -m rul train --config fd001.toml --dry-run --cmapss-dir ../backend/data/cmapss --runs-dir runs || echo "dry-run needs C-MAPSS; fixture path only"
      - name: Contract tests
        run: pytest tests -q
      - name: Contract parity (training path == serving path)
        run: |
          python -c "from rul.contract import FEATURE_ORDER, build_matrix, build_matrix_per_row_regime; print(f'contract: {len(FEATURE_ORDER)} features, per-row regime OK')"

  images:
    name: Docker · build both images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [api, web, ml]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          push: false
          load: true
          tags: fdt-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: false
          load: true
          tags: fdt-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size gate (backend < 500 MB, frontend < 200 MB)
        run: |
          MAX_API=524288000  # 500 MB
          MAX_WEB=209715200  # 200 MB
          api=$(docker image inspect fdt-api:ci --format '{{.Size}}')
          web=$(docker image inspect fdt-web:ci --format '{{.Size}}')
          echo "Backend image: $api bytes"
          echo "Frontend image: $web bytes"
          if [ "$api" -gt "$MAX_API" ]; then
            echo "::error::Backend image ${api}B > ${MAX_API}B"
            exit 1
          fi
          if [ "$web" -gt "$MAX_WEB" ]; then
            echo "::error::Frontend image ${web}B > ${MAX_WEB}B"
            exit 1
          fi

      - name: nginx configuration is valid
        # FDT_API_HOST=127.0.0.1 so the upstream resolves without a Compose network.
        # Validating this against the literal `api` service name would only fail on DNS,
        # which would say nothing about the config being correct.
        run: |
          docker run --rm -e FDT_API_HOST=127.0.0.1 --entrypoint nginx fdt-web:ci -t

      - name: Compose file is valid
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet